# ============================================================
# Authiva Configuration
# ============================================================

authentication:

  # Seconds before an unauthenticated player is kicked.
  login-timeout: 60

  # Maximum failed login attempts.
  max-login-attempts: 5

  # Password length.
  password-min-length: 8
  password-max-length: 32

  # Repeated authentication reminders.
  reminders:
    enabled: true

    # Seconds between reminders.
    interval: 5

    # Send the authentication message immediately after joining.
    send-on-join: true

  # Automatically authenticate after successful registration.
  auto-login-after-register: true


# ============================================================
# Password
# ============================================================

password:

  allow-letters: true
  allow-numbers: true
  allow-symbols: true

  require-letter: true
  require-number: true
  require-symbol: false

  # Passwords that cannot be used.
  forbidden:
    - "12345678"
    - "123456789"
    - "1234567890"
    - "password"
    - "password123"
    - "qwerty"
    - "qwerty123"
    - "qwertyui"
    - "admin"
    - "admin123"
    - "minecraft"
    - "minecraft123"
    - "letmein"
    - "welcome"
    - "abc123"
    - "11111111"
    - "00000000"

  # Ignore upper/lower case when checking forbidden passwords.
  forbidden-case-insensitive: true


# ============================================================
# Storage
# ============================================================

storage:

  # Currently supported: sqlite
  type: sqlite

  file: authiva.db


# ============================================================
# Protection
# ============================================================

protection:

  freeze-movement: true
  block-interaction: true
  block-attacks: true
  prevent-mob-targeting: true

  block-damage: true
  block-item-drop: true
  block-item-pickup: true
  block-inventory: true
  block-held-item-change: true

  case-insensitive-commands: true


# ============================================================
# Commands
# ============================================================

commands:

  # Commands allowed before authentication.
  allowed-before-login:
    - login
    - l
    - log
    - register
    - reg

  allow-help: false


# ============================================================
# Bypass
# ============================================================

bypass:

  enabled: true
  permission: authiva.bypass


# ============================================================
# Update Checker
# ============================================================

update-checker:

  enabled: true
  notify-operators: true


# ============================================================
# Metrics
# ============================================================

metrics:

  enabled: true


# ============================================================
# Messages
# ============================================================

messages:

  # Global prefix.
  prefix: "&8[&bAuthiva&8] &r"

  # Authentication
  login-prompt:
    - "{prefix}&eWelcome, &f{player}&e!"
    - "{prefix}&7Please login to continue."
    - "{prefix}&b/login <password>"

  register-prompt:
    - "{prefix}&eWelcome, &f{player}&e!"
    - "{prefix}&7You don't have an account."
    - "{prefix}&b/register <password> <confirmPassword>"

  reminder:
    - "{prefix}&cYou are not authenticated!"
    - "{prefix}&eUse &f/login <password> &eto continue."

  reminder-with-time:
    - "{prefix}&eAuthentication required."
    - "{prefix}&7Time remaining: &f{seconds}s"
    - "{prefix}&b/login <password> &7or &b/register <password> <confirmPassword>"

  login-required:
    - "{prefix}&cYou must login or register first."

  login-timeout:
    - "{prefix}&cAuthentication timeout."
    - "{prefix}&7You took too long to authenticate."

  # Login
  login-usage:
    - "{prefix}&eUsage: &f/login <password>"

  login-success:
    - "{prefix}&aLogin successful!"
    - "{prefix}&7Welcome back, &f{player}&7."

  already-logged-in:
    - "{prefix}&eYou are already logged in."

  not-registered:
    - "{prefix}&cYou do not have an Authiva account."
    - "{prefix}&eUse &f/register <password> <confirmPassword>"

  invalid-password:
    - "{prefix}&cInvalid password."
    - "{prefix}&7Attempts remaining: &f{remaining}"

  max-login-attempts:
    - "{prefix}&cToo many failed login attempts."

  # Registration
  register-usage:
    - "{prefix}&eUsage: &f/register <password> <confirmPassword>"

  password-mismatch:
    - "{prefix}&cPasswords do not match."

  account-created:
    - "{prefix}&aAccount created successfully!"
    - "{prefix}&7You are now authenticated."

  account-created-login-failed:
    - "{prefix}&eAccount created."
    - "{prefix}&7Please login using &f/login <password>"

  already-registered:
    - "{prefix}&cYou already have an Authiva account."

  username-taken:
    - "{prefix}&cThat username is already registered."

  register-failed:
    - "{prefix}&cUnable to create your account."

  # Password validation
  password-too-short:
    - "{prefix}&cPassword must contain at least &f{min}&c characters."

  password-too-long:
    - "{prefix}&cPassword cannot contain more than &f{max}&c characters."

  password-needs-letter:
    - "{prefix}&cPassword must contain at least one letter."

  password-needs-number:
    - "{prefix}&cPassword must contain at least one number."

  password-needs-symbol:
    - "{prefix}&cPassword must contain at least one symbol."

  invalid-password-characters:
    - "{prefix}&cYour password contains forbidden characters."

  forbidden-password:
    - "{prefix}&cThis password is not allowed."

  # Protection
  movement-blocked:
    - "{prefix}&cYou must authenticate before moving."

  interaction-blocked:
    - "{prefix}&cYou must authenticate before interacting."

  attack-blocked:
    - "{prefix}&cYou must authenticate before attacking."

  # Account management
  change-password-usage:
    - "{prefix}&eUsage: &f/changepassword <currentPassword> <newPassword>"

  password-changed:
    - "{prefix}&aYour password has been changed successfully."

  invalid-current-password:
    - "{prefix}&cYour current password is incorrect."

  change-password-failed:
    - "{prefix}&cUnable to change your password."

  unregister-usage:
    - "{prefix}&eUsage: &f/unregister <password>"

  account-unregistered:
    - "{prefix}&aYour Authiva account has been unregistered."

  unregister-failed:
    - "{prefix}&cUnable to unregister your account."

  logout-success:
    - "{prefix}&aYou have been logged out."

  # Errors
  auth-unavailable:
    - "{prefix}&cAuthentication service is temporarily unavailable."

  only-players:
    - "{prefix}&cOnly players can use this command."

  # Admin
  admin-only:
    - "{prefix}&cOnly server operators can use this command."

  admin-set-password-usage:
    - "{prefix}&eUsage: &f/authiva setpassword <player> <newPassword>"

  admin-unregister-usage:
    - "{prefix}&eUsage: &f/authiva unregister <player>"

  admin-logout-usage:
    - "{prefix}&eUsage: &f/authiva logout <player>"

  admin-info-usage:
    - "{prefix}&eUsage: &f/authiva info <player>"

  admin-password-changed:
    - "{prefix}&aPassword changed successfully for &f{player}&a."

  admin-account-unregistered:
    - "{prefix}&aAccount unregistered successfully for &f{player}&a."

  admin-player-logged-out:
    - "{prefix}&a&f{player} &ahas been logged out."

  admin-player-not-registered:
    - "{prefix}&cThat player does not have an Authiva account."

  admin-set-password-failed:
    - "{prefix}&cUnable to change that account password."

  admin-unregister-failed:
    - "{prefix}&cUnable to unregister that account."

  admin-logout-failed:
    - "{prefix}&cUnable to logout that account."

  admin-info:
    - "{prefix}&eAccount: &f{player}"
    - "{prefix}&eUUID: &f{uuid}"
    - "{prefix}&eCreated: &f{created}"

  admin-info-failed:
    - "{prefix}&cUnable to retrieve account information."

  admin-list-header:
    - "{prefix}&eAuthiva accounts:"

  admin-list-entry:
    - "{prefix}&7- &f{player}"

  admin-list-footer:
    - "{prefix}&eTotal accounts: &f{count}"

  admin-list-empty:
    - "{prefix}&7There are no registered Authiva accounts."

  admin-list-failed:
    - "{prefix}&cUnable to retrieve the account list."

  admin-reloaded:
    - "{prefix}&aAuthiva configuration reloaded."

  admin-help:
    - "{prefix}&eAuthiva administration commands:"
